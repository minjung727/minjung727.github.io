<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <style>
    html, body { margin:0; height:100%; background:#f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    a { color:#1b61c9; text-decoration:none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</helmet>
<div style="min-height:100vh; background:#f5f5f7; display:flex; flex-direction:column;">
  <nav style="position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; height:64px; padding:0 40px; background:#ffffff; border-bottom:1px solid #dddddd;">
    <a href="index.html" style="font-size:16px; font-weight:500; color:#181d26;">Minjung Kim</a>
    <a href="assets/Minjung_Kim_CV.pdf" download style="background:#181d26; color:#ffffff; font-size:15px; font-weight:500; padding:10px 18px; border-radius:12px;">Download CV (PDF)</a>
  </nav>
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:20px; padding:32px;">
    <div ref="{{ setContainerRef }}" style="display:flex; flex-direction:column; align-items:center; gap:20px; width:100%; max-width:900px;"></div>
    <span style="font-size:13px; color:#41454d;">Preview not loading? <a href="assets/Minjung_Kim_CV.pdf" download>Download the PDF directly</a>.</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  componentDidMount() {
    const wait = () => {
      if (window.pdfjsLib) { this.render(); return; }
      setTimeout(wait, 150);
    };
    wait();
  }

  async render() {
    const container = this._container;
    if (!container) return;
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    try {
      const doc = await window.pdfjsLib.getDocument('assets/Minjung_Kim_CV.pdf').promise;
      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const viewport = page.getViewport({ scale: 1.6 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width = '100%';
        canvas.style.height = 'auto';
        canvas.style.boxShadow = '0 4px 24px rgba(0,0,0,0.12)';
        canvas.style.borderRadius = '8px';
        canvas.style.background = '#fff';
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport }).promise;
        container.appendChild(canvas);
      }
    } catch (e) {
      container.innerHTML = '<div style="color:#41454d; font-size:14px;">Could not render preview.</div>';
    }
  }

  renderVals() {
    return {
      setContainerRef: (el) => { this._container = el; },
    };
  }
}

</script>
</body>
</html>
